<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlante Storico (1515 - 1680) — Cronologia Interattiva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    :root {
      /* Complementari esatti (255 - RGB) dei colori originali */
      --bg-deep: #f6f5f0;
      --bg-glass: rgba(237, 235, 227, 0.85);
      --border-glass: rgba(43, 80, 149, 0.15);
      --border-glass-strong: rgba(43, 80, 149, 0.35);
      --gold: #2b5095;
      --gold-light: #0c1933;
      --gold-dim: rgba(43, 80, 149, 0.12);
      --text-main: #0c0b09;
      --text-muted: #6b654f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% -20%, rgba(43, 80, 149, 0.12), transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(215, 169, 112, 0.08), transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(117, 169, 113, 0.08), transparent 50%);
    }

    /* Header e Navigazione Superiore */
    header {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-glass);
      padding: 20px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.5);
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(43, 80, 149, 0.2), rgba(43, 80, 149, 0.05));
      border: 1px solid var(--border-glass-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      box-shadow: 0 0 15px rgba(43, 80, 149, 0.15);
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #000000 40%, var(--gold-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .controls-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background: rgba(241, 239, 233, 0.8);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      padding: 8px 14px 8px 38px;
      color: var(--text-main);
      font-size: 0.85rem;
      width: 220px;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(43, 80, 149, 0.2);
      width: 260px;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      width: 16px;
      height: 16px;
    }

    .zoom-group {
      display: inline-flex;
      align-items: center;
      background: rgba(241, 239, 233, 0.8);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }

    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .zoom-btn:hover {
      background: rgba(0, 0, 0, 0.05);
      color: var(--text-main);
    }

    .zoom-btn.active-zoom {
      background: var(--gold-dim);
      color: var(--gold);
      border: 1px solid var(--border-glass);
    }

    /* Struttura Principale */
    main {
      flex: 1;
      padding: 24px 36px 36px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .atlas-container {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      box-shadow: 0 30px 60px rgba(255, 255, 255, 0.7), inset 0 1px 0 rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .atlas-header {
      padding: 16px 28px;
      background: rgba(241, 239, 233, 0.6);
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .nav-instruction {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .nav-instruction i {
      color: var(--gold);
    }

    .legends-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .legend-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(241, 239, 233, 0.7);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .legend-chip:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .legend-chip.inactive {
      opacity: 0.35;
      filter: grayscale(80%);
    }

    .swatch {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
    }

    /* Area Scrollabile della Timeline */
    .timeline-viewport {
      overflow-x: auto;
      overflow-y: hidden;
      width: 100%;
      padding: 30px 0 45px 0;
      cursor: grab;
      background-image: radial-gradient(rgba(43, 80, 149, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--gold) rgba(241, 239, 233, 0.9);
    }

    .timeline-viewport::-webkit-scrollbar {
      height: 10px;
    }

    .timeline-viewport::-webkit-scrollbar-track {
      background: rgba(241, 239, 233, 0.9);
      border-top: 1px solid var(--border-glass);
    }

    .timeline-viewport::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 999px;
      border: 2px solid rgba(241, 239, 233, 0.9);
    }

    .timeline-viewport:active {
      cursor: grabbing;
    }

    .timeline-board {
      position: relative;
      height: 680px;
      margin: 0 60px;
    }

    /* Etichette Corsie Laterali (Aree Geografiche/Politiche) */
    .lane-label-track {
      position: absolute;
      left: -190px;
      width: 170px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }

    .lane-tag {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gold-light);
      padding-right: 12px;
      border-right: 2px solid var(--gold);
      background: linear-gradient(90deg, transparent, rgba(43, 80, 149, 0.05));
    }

    /* Sfondi Corsie Orizzontali */
    .lane-divider {
      position: absolute;
      left: 0;
      right: 0;
      border-bottom: 1px dashed rgba(0, 0, 0, 0.06);
      pointer-events: none;
    }

    /* Anni & Griglia Verticale */
    .grid-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      border-left: 1px dashed rgba(0, 0, 0, 0.04);
      pointer-events: none;
    }

    .grid-tick.major {
      border-left: 1px solid rgba(0, 0, 0, 0.09);
    }

    .year-badge-node {
      position: absolute;
      top: 342px;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #e7e4db, #efede7);
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-glass-strong);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.6);
      z-index: 6;
    }

    /* Asse Centrale Principale */
    .central-timeline-axis {
      position: absolute;
      left: 0;
      right: 0;
      top: 358px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold) 15%, #000000 50%, var(--gold) 85%, transparent);
      box-shadow: 0 0 15px rgba(43, 80, 149, 0.4);
      z-index: 3;
    }

    /* Barre Periodi Storici (Sopra l'asse) */
    .historical-period-bar {
      position: absolute;
      height: 34px;
      border-radius: 10px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #000000;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.14) 0%, rgba(255, 255, 255, 0.22) 100%);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.5), inset 0 1px 0 rgba(0, 0, 0, 0.3);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 5;
      overflow: hidden;
      white-space: nowrap;
      border: 1px solid rgba(0, 0, 0, 0.2);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
    }

    .historical-period-bar:hover {
      transform: translateY(-3px) scale(1.008);
      filter: brightness(0.92);
      box-shadow: 0 12px 30px rgba(255, 255, 255, 0.7), inset 0 1px 0 rgba(0, 0, 0, 0.4);
      z-index: 15;
      border-color: #000000;
    }

    .period-label-text {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .period-range-tag {
      font-size: 0.68rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.35);
      padding: 3px 7px;
      border-radius: 5px;
      letter-spacing: 0.03em;
      flex-shrink: 0;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    /* Eventi Puntuali (Sotto l'asse) */
    .historical-event-node {
      position: absolute;
      top: 360px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 5;
    }

    .historical-event-node:hover {
      z-index: 20;
    }

    .event-dot-marker {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2.5px solid var(--bg-deep);
      margin-top: -6px;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .historical-event-node:hover .event-dot-marker {
      transform: scale(1.5);
    }

    .event-connector-stem {
      width: 2px;
      background: linear-gradient(180deg, rgba(43, 80, 149, 0.6) 0%, rgba(0, 0, 0, 0.15) 100%);
      transition: background 0.2s;
    }

    .historical-event-card {
      background: linear-gradient(180deg, #e4e1d7 0%, #eceae3 100%);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-left-width: 4px;
      border-radius: 10px;
      padding: 10px 12px;
      width: 174px;
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.5), inset 0 1px 0 rgba(0, 0, 0, 0.06);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .historical-event-node:hover .historical-event-card {
      transform: translateY(4px) scale(1.03);
      background: linear-gradient(180deg, #dbd7ca, #e6e3da);
      border-color: rgba(0, 0, 0, 0.3);
      box-shadow: 0 16px 35px rgba(255, 255, 255, 0.7);
    }

    .event-card-date {
      font-size: 0.71rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      filter: brightness(0.75) saturate(1.3);
    }

    .event-card-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
      margin-top: 3px;
    }

    /* Finestra Modale di Approfondimento */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(250, 249, 246, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.open {
      display: flex;
      opacity: 1;
    }

    .modal-window {
      background: linear-gradient(180deg, #e3dfd2 0%, #eeece5 100%);
      border: 1px solid var(--border-glass-strong);
      border-radius: 20px;
      max-width: 560px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 35px 70px rgba(255, 255, 255, 0.85), inset 0 1px 0 rgba(0, 0, 0, 0.12);
      transform: translateY(15px) scale(0.95);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .modal-overlay.open .modal-window {
      transform: translateY(0) scale(1);
    }

    .modal-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-glass);
    }

    .modal-category-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      color: #000000;
      margin-bottom: 10px;
      border: 1px solid rgba(0, 0, 0, 0.25);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
    }

    .modal-headline {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.25;
      color: #000000;
    }

    .modal-close-btn {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-glass);
      width: 38px;
      height: 38px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .modal-close-btn:hover {
      background: rgba(0, 0, 0, 0.15);
      border-color: var(--gold);
      color: #000000;
      transform: rotate(90deg);
    }

    .modal-content-body {
      font-size: 0.96rem;
      line-height: 1.75;
      color: #2e2a24;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
      }
      main {
        padding: 16px;
      }
      .lane-label-track {
        display: none;
      }
      .timeline-board {
        margin: 0 20px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-area">
      <div class="brand-icon">
        <i data-lucide="landmark"></i>
      </div>
      <div>
        <h1>Atlante Storico (1515 - 1680)</h1>
        <p class="subtitle">Esplora l'età moderna: imperi, conflitti religiosi e trasformazioni statali</p>
      </div>
    </div>
    <div class="controls-wrapper">
      <div class="search-box">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" placeholder="Cerca evento o periodo..." />
      </div>
      <div class="zoom-group">
        <button class="zoom-btn" id="zoomOut">
          <i data-lucide="zoom-out" style="width:14px; height:14px;"></i> Riduci
        </button>
        <button class="zoom-btn active-zoom" id="zoomReset">100%</button>
        <button class="zoom-btn" id="zoomIn">
          <i data-lucide="zoom-in" style="width:14px; height:14px;"></i> Ingrandisci
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="atlas-container">
      <div class="atlas-header">
        <div class="nav-instruction">
          <i data-lucide="move-horizontal"></i>
          <span>Trascina o scorri orizzontalmente per esplorare la linea del tempo</span>
        </div>
        <div class="legends-bar" id="legendContainer">
          <!-- Generato dinamicamente via JS -->
        </div>
      </div>

      <div class="timeline-viewport" id="timelineScroll">
        <div class="timeline-board" id="timelineCanvas">
          <!-- Corsie e Contenuti dinamici -->
        </div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
    <div class="modal-window">
      <div class="modal-header-flex">
        <div>
          <span class="modal-category-badge" id="modalBadge"></span>
          <h3 class="modal-headline" id="modalTitle"></h3>
        </div>
        <button class="modal-close-btn" id="modalClose" aria-label="Chiudi">
          <i data-lucide="x" style="width:18px; height:18px;"></i>
        </button>
      </div>
      <p class="modal-content-body" id="modalDesc"></p>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const START_YEAR = 1515;
    const END_YEAR = 1680;
    let pixelsPerYear = 14;

    const lanes = [
      { id: 0, title: "Impero / Germania" },
      { id: 1, title: "Impero Asburgico" },
      { id: 2, title: "Chiesa / Controriforma" },
      { id: 3, title: "Spagna & Fiandre" },
      { id: 4, title: "Paesi Bassi" },
      { id: 5, title: "Inghilterra" },
      { id: 6, title: "Francia" }
    ];

    /* Complementari esatti (255 - RGB) dei colori delle categorie */
    const categories = {
      impero: { name: "Impero / Germania", color: "#937bac" },      /* da #6c8453 */
      chiesa: { name: "Stato della Chiesa", color: "#75a971" },     /* da #8a568e */
      spagna: { name: "Spagna & Fiandre", color: "#5c7cb7" },       /* da #a38348 */
      inghilterra: { name: "Inghilterra", color: "#d7a970" },       /* da #28568f */
      francia: { name: "Francia", color: "#60b6b3" }                /* da #9f494c */
    };

    const periodi = [
      {
        titolo: "Riforma luterana",
        inizio: 1517,
        fine: 1521,
        corsia: 0,
        categoria: "impero",
        descrizione: "Avvio della frattura religiosa in Germania con la pubblicazione delle tesi di Martin Lutero fino alla Dieta di Worms e alla definitiva scomunica imperiale."
      },
      {
        titolo: "Epoca della confessionalizzazione",
        inizio: 1555,
        fine: 1618,
        corsia: 0,
        categoria: "impero",
        descrizione: "Periodo compreso tra la Pace di Augusta e lo scoppio della Guerra dei Trent'anni, caratterizzato dalla definizione delle identità confessionali e da crescenti tensioni istituzionali."
      },
      {
        titolo: "Impero di Carlo V",
        inizio: 1519,
        fine: 1556,
        corsia: 1,
        categoria: "impero",
        descrizione: "Il vasto regno universale di Carlo d'Asburgo, segnato dai conflitti per l'egemonia europea contro la Francia di Francesco I e l'espansione ottomana."
      },
      {
        titolo: "Guerra dei Trent'anni",
        inizio: 1618,
        fine: 1648,
        corsia: 1,
        categoria: "impero",
        descrizione: "Immane conflitto europeo originato da motivazioni religiose e politiche nell'Impero germanico, conclusosi con i trattati della Pace di Vestfalia."
      },
      {
        titolo: "Concilio di Trento e Controriforma",
        inizio: 1545,
        fine: 1563,
        corsia: 2,
        categoria: "chiesa",
        descrizione: "Grande concilio ecumenico volto a ridefinire il dogma cattolico, contrastare il protestantesimo e riorganizzare la disciplina pastorale in tutta Europa."
      },
      {
        titolo: "Regno di Filippo II",
        inizio: 1556,
        fine: 1598,
        corsia: 3,
        categoria: "spagna",
        descrizione: "Il governo del 'Re Prudente', difensore intransigente della fede cattolica, al vertice della potenza globale spagnola e dei suoi domini transoceanici ed europei."
      },
      {
        titolo: "Rivolta dei Paesi Bassi",
        inizio: 1566,
        fine: 1581,
        corsia: 4,
        categoria: "spagna",
        descrizione: "L'insurrezione delle province settentrionali dei Paesi Bassi contro il centralismo e l'intolleranza religiosa spagnola, culminata nell'Atto di Abiura."
      },
      {
        titolo: "Riforma e Tudor (Enrico VIII - Maria I)",
        inizio: 1534,
        fine: 1558,
        corsia: 5,
        categoria: "inghilterra",
        descrizione: "Il distacco della Chiesa inglese da Roma con lo scisma enriciano e le successive oscillazioni confessionali tra protestantesimo e restaurazione cattolica."
      },
      {
        titolo: "Epoca elisabettiana",
        inizio: 1558,
        fine: 1603,
        corsia: 5,
        categoria: "inghilterra",
        descrizione: "L'età dell'oro inglese sotto Elisabetta I: consolidamento definitivo dell'anglicanesimo, fioritura culturale rinascimentale e affermazione marittima."
      },
      {
        titolo: "Guerre di religione in Francia",
        inizio: 1562,
        fine: 1598,
        corsia: 6,
        categoria: "francia",
        descrizione: "Sanguinosi conflitti civili e dinastici tra la fazione cattolica e gli ugonotti calvinisti francesi, culminati nella celebre crisi dello Stato sabaudo-francese."
      },
      {
        titolo: "Regno di Enrico IV",
        inizio: 1598,
        fine: 1610,
        corsia: 6,
        categoria: "francia",
        descrizione: "Il primo monarca borbonico pacifica la nazione devastata dalle guerre civili grazie alla tolleranza dell'Editto di Nantes e avvia la ripresa economica."
      },
      {
        titolo: "Reggenza e avvio di Luigi XIII",
        inizio: 1610,
        fine: 1624,
        corsia: 6,
        categoria: "francia",
        descrizione: "Periodo di reggenza sotto Maria de' Medici e transizione verso il consolidamento monarchico prima della piena affermazione del cardinale Richelieu."
      },
      {
        titolo: "Governo del cardinale Richelieu",
        inizio: 1624,
        fine: 1642,
        corsia: 6,
        categoria: "francia",
        descrizione: "Azione politica incisiva volta a rafforzare l'assolutismo regio in Francia, abbattere il potere politico ugonotto e contrastare il predominio degli Asburgo."
      }
    ];

    const eventi = [
      {
        anno: 1517,
        dataEtichetta: "31 Ott 1517",
        titolo: "Martin Lutero affige le 95 tesi",
        livello: 0,
        categoria: "impero",
        descrizione: "Il monaco agostiniano Martin Lutero affigge le 95 tesi sulla porta della cattedrale di Wittenberg, contestando la pratica delle indulgenze."
      },
      {
        anno: 1534,
        dataEtichetta: "1534",
        titolo: "Atto di Supremazia inglese",
        livello: 1,
        categoria: "inghilterra",
        descrizione: "Il Parlamento approva l'Atto di Supremazia, sancendo formalmente la nascita della Chiesa anglicana indipendente dall'autorità papale."
      },
      {
        anno: 1555,
        dataEtichetta: "1555",
        titolo: "Pace di Augusta",
        livello: 0,
        categoria: "impero",
        descrizione: "Viene sancito il principio del 'cuius regio, eius religio', legalizzando la coesistenza tra cattolicesimo e luteranesimo all'interno del Sacro Romano Impero."
      },
      {
        anno: 1571,
        dataEtichetta: "7 Ott 1571",
        titolo: "Battaglia di Lepanto",
        livello: 1,
        categoria: "spagna",
        descrizione: "La flotta della Lega Santa cristiana sconfigge decisamente le forze navali dell'Impero Ottomano nelle acque del Peloponneso."
      },
      {
        anno: 1572,
        dataEtichetta: "24 Ago 1572",
        titolo: "Strage di san Bartolomeo",
        livello: 2,
        categoria: "francia",
        descrizione: "Il feroce massacro degli ugonotti a Parigi durante la notte di San Bartolomeo, che impresse una svolta drammatica alle guerre di religione."
      },
      {
        anno: 1588,
        dataEtichetta: "1588",
        titolo: "Sconfitta dell'Invincibile Armata",
        livello: 0,
        categoria: "inghilterra",
        descrizione: "La flotta strategica spagnola inviata contro l'Inghilterra viene dispersa e sconfitta, segnando l'ascesa della potenza navale inglese."
      },
      {
        anno: 1598,
        dataEtichetta: "1598",
        titolo: "Editto di Nantes",
        livello: 1,
        categoria: "francia",
        descrizione: "Re Enrico IV promulga l'editto garantendo libertà di coscienza e diritti civili e militari alla minoranza ugonotta francese."
      },
      {
        anno: 1648,
        dataEtichetta: "1648",
        titolo: "Pace di Vestfalia",
        livello: 2,
        categoria: "impero",
        descrizione: "I trattati di Vestfalia pongono fine alla Guerra dei Trent'anni, ridefinendo il sistema degli Stati europei e il diritto internazionale."
      }
    ];

    const activeFilters = {
      impero: true,
      chiesa: true,
      spagna: true,
      inghilterra: true,
      francia: true
    };

    const canvas = document.getElementById("timelineCanvas");
    const legendContainer = document.getElementById("legendContainer");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalBadge = document.getElementById("modalBadge");
    const modalTitle = document.getElementById("modalTitle");
    const modalDesc = document.getElementById("modalDesc");
    const modalClose = document.getElementById("modalClose");
    const searchInput = document.getElementById("searchInput");

    function renderLegends() {
      legendContainer.innerHTML = "";
      Object.keys(categories).forEach(key => {
        const cat = categories[key];
        const chip = document.createElement("div");
        chip.className = `legend-chip ${activeFilters[key] ? '' : 'inactive'}`;
        chip.innerHTML = `
          <span class="swatch" style="background: ${cat.color}; color: ${cat.color};"></span>
          <span>${cat.name}</span>
        `;
        chip.addEventListener("click", () => {
          activeFilters[key] = !activeFilters[key];
          renderLegends();
          renderTimeline();
        });
        legendContainer.appendChild(chip);
      });
    }

    function openModal(badgeText, badgeColor, title, description) {
      modalBadge.textContent = badgeText;
      modalBadge.style.backgroundColor = badgeColor;
      modalTitle.textContent = title;
      modalDesc.textContent = description;
      modalOverlay.classList.add("open");
    }

    modalClose.addEventListener("click", () => modalOverlay.classList.remove("open"));
    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove("open");
    });

    function renderTimeline() {
      canvas.innerHTML = "";
      const totalWidth = (END_YEAR - START_YEAR) * pixelsPerYear;
      canvas.style.width = totalWidth + "px";

      const labelTrack = document.createElement("div");
      labelTrack.className = "lane-label-track";
      lanes.forEach(lane => {
        const tag = document.createElement("div");
        tag.className = "lane-tag";
        tag.textContent = lane.title;
        tag.style.top = (16 + lane.id * 44) + "px";
        labelTrack.appendChild(tag);
      });
      canvas.appendChild(labelTrack);

      lanes.forEach((_, idx) => {
        if(idx > 0) {
          const divider = document.createElement("div");
          divider.className = "lane-divider";
          divider.style.top = (16 + idx * 44 - 6) + "px";
          canvas.appendChild(divider);
        }
      });

      const axis = document.createElement("div");
      axis.className = "central-timeline-axis";
      canvas.appendChild(axis);

      for (let year = START_YEAR; year <= END_YEAR; year += 5) {
        const x = (year - START_YEAR) * pixelsPerYear;
        const isMajor = year % 10 === 0;

        const tick = document.createElement("div");
        tick.className = `grid-tick ${isMajor ? 'major' : ''}`;
        tick.style.left = x + "px";
        canvas.appendChild(tick);

        if (isMajor || pixelsPerYear >= 18) {
          const yearBadge = document.createElement("div");
          yearBadge.className = "year-badge-node";
          yearBadge.style.left = x + "px";
          yearBadge.textContent = year;
          canvas.appendChild(yearBadge);
        }
      }

      const searchQuery = searchInput.value.toLowerCase().trim();

      periodi.forEach(p => {
        if (!activeFilters[p.categoria]) return;

        const matchesSearch = !searchQuery || 
          p.titolo.toLowerCase().includes(searchQuery) || 
          p.descrizione.toLowerCase().includes(searchQuery);

        const left = (p.inizio - START_YEAR) * pixelsPerYear;
        const width = Math.max((p.fine - p.inizio) * pixelsPerYear, 40);
        const top = 16 + p.corsia * 44;
        const color = categories[p.categoria].color;

        const bar = document.createElement("div");
        bar.className = "historical-period-bar";
        bar.style.left = left + "px";
        bar.style.width = width + "px";
        bar.style.top = top + "px";
        bar.style.backgroundColor = color;
        if (searchQuery && matchesSearch) {
          bar.style.boxShadow = "0 0 20px #000000, inset 0 1px 0 rgba(0,0,0,0.5)";
          bar.style.borderColor = "#000000";
        } else if (searchQuery && !matchesSearch) {
          bar.style.opacity = "0.2";
        }

        bar.innerHTML = `
          <span class="period-label-text">${p.titolo}</span>
          <span class="period-range-tag">${p.inizio}–${p.fine}</span>
        `;

        bar.addEventListener("click", () => {
          openModal(`${p.inizio} – ${p.fine}`, color, p.titolo, p.descrizione);
        });

        canvas.appendChild(bar);
      });

      eventi.forEach(ev => {
        if (!activeFilters[ev.categoria]) return;

        const matchesSearch = !searchQuery || 
          ev.titolo.toLowerCase().includes(searchQuery) || 
          ev.descrizione.toLowerCase().includes(searchQuery) ||
          ev.dataEtichetta.toLowerCase().includes(searchQuery);

        const left = (ev.anno - START_YEAR) * pixelsPerYear;
        const stemHeights = [26, 96, 166];
        const stemHeight = stemHeights[ev.livello] || 26;
        const color = categories[ev.categoria].color;

        const marker = document.createElement("div");
        marker.className = "historical-event-node";
        marker.style.left = left + "px";
        if (searchQuery && !matchesSearch) {
          marker.style.opacity = "0.2";
        }

        marker.innerHTML = `
          <div class="event-dot-marker" style="background: ${color}; box-shadow: 0 0 12px ${color};"></div>
          <div class="event-connector-stem" style="height: ${stemHeight}px;"></div>
          <div class="historical-event-card" style="border-left-color: ${color};">
            <div class="event-card-date" style="color: ${color};">${ev.dataEtichetta}</div>
            <div class="event-card-title">${ev.titolo}</div>
          </div>
        `;

        marker.addEventListener("click", () => {
          openModal(ev.dataEtichetta, color, ev.titolo, ev.descrizione);
        });

        canvas.appendChild(marker);
      });
    }

    const zoomInBtn = document.getElementById("zoomIn");
    const zoomOutBtn = document.getElementById("zoomOut");
    const zoomResetBtn = document.getElementById("zoomReset");

    function updateZoomButtons() {
      zoomInBtn.classList.remove("active-zoom");
      zoomOutBtn.classList.remove("active-zoom");
      zoomResetBtn.classList.remove("active-zoom");

      if (pixelsPerYear > 14) zoomInBtn.classList.add("active-zoom");
      else if (pixelsPerYear < 14) zoomOutBtn.classList.add("active-zoom");
      else zoomResetBtn.classList.add("active-zoom");
    }

    zoomInBtn.addEventListener("click", () => {
      pixelsPerYear = Math.min(26, pixelsPerYear + 3);
      updateZoomButtons();
      renderTimeline();
    });

    zoomOutBtn.addEventListener("click", () => {
      pixelsPerYear = Math.max(8, pixelsPerYear - 3);
      updateZoomButtons();
      renderTimeline();
    });

    zoomResetBtn.addEventListener("click", () => {
      pixelsPerYear = 14;
      updateZoomButtons();
      renderTimeline();
    });

    searchInput.addEventListener("input", () => {
      renderTimeline();
    });

    const scrollViewport = document.getElementById("timelineScroll");
    let isDragging = false;
    let startXPos, scrollLeftPos;

    scrollViewport.addEventListener("mousedown", (e) => {
      isDragging = true;
      startXPos = e.pageX - scrollViewport.offsetLeft;
      scrollLeftPos = scrollViewport.scrollLeft;
    });

    scrollViewport.addEventListener("mouseleave", () => { isDragging = false; });
    scrollViewport.addEventListener("mouseup", () => { isDragging = false; });

    scrollViewport.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      e.preventDefault();
      const x = e.pageX - scrollViewport.offsetLeft;
      const walk = (x - startXPos) * 1.5;
      scrollViewport.scrollLeft = scrollLeftPos - walk;
    });

    renderLegends();
    renderTimeline();
  </script>
</body>
</html>
